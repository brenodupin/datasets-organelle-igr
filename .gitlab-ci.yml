include:
  - remote: 'https://gitlab.com/deploy2zenodo/deploy2zenodo/-/releases/permalink/latest/downloads/deploy2zenodo.yaml'

deploy2zenodo:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  variables:
    DEPLOY2ZENODO_API_URL: "https://sandbox.zenodo.org/api"
    DEPLOY2ZENODO_ACCESS_TOKEN: "$ZENODO_SANDBOX_TOKEN"
    DEPLOY2ZENODO_JSON: "zenodo_meta.json"
    DEPLOY2ZENODO_DEPOSITION_ID: "474042"
    DEPLOY2ZENODO_UPLOAD: "$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
    DEPLOY2ZENODO_SKIP_PUBLISH: "true"
    GIT_LFS_SKIP_SMUDGE: "0"
  before_script:
    - apk add --no-cache curl jq py3-pip git-lfs zip
    - pip install cffconvert --break-system-packages
    - git lfs pull
    - publication_date=$(echo "$CI_COMMIT_TIMESTAMP" | grep -Eo "^[0-9]{4}-[0-9]{2}-[0-9]{2}")
    - |
      cffconvert -i CITATION.cff -f zenodo | \
        jq -c '{"metadata": .} | .metadata += {"upload_type": "dataset"}' | \
        jq -c ".metadata.version = \"${CI_COMMIT_TAG#v}\" |
          .metadata.publication_date = \"$publication_date\"" | \
        tee $DEPLOY2ZENODO_JSON | jq -C .
    - zip -r "$DEPLOY2ZENODO_UPLOAD" . -x '.git/*' -x '.gitlab-ci.sandbox.yml'
  artifacts:
    paths:
      - $DEPLOY2ZENODO_JSON